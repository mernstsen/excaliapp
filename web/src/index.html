<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>ExcaliApp</title>
    <script>
      // Excalidraw resolves font files against this base.
      window.EXCALIDRAW_ASSET_PATH = "excaliapp://app/";
    </script>
    <link rel="stylesheet" href="app.css" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* The canvas owns the whole window; the native title bar provides the chrome. */
      .excalidraw .App-menu_top .buttonList {
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="app.js"></script>
  </body>
</html>
